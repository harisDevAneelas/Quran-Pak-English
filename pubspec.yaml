name: quran_app
description: Production Quran reader with Tajweed coloring.
publish_to: 'none'
version: 6.1.0+14

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  scrollable_positioned_list: ^0.3.8
  arabic_text_justification:
    path: third_party/arabic_text_justification
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.6
  just_audio: ^0.10.6
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  flutter_local_notifications: ^19.4.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  http: ^1.2.2
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  geolocator: ^14.1.2
  adhan: ^2.0.0+1
  hijri: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  # English splash (cropped from splash.png). One asset: splash_screen.png.
  background_image: assets/splash/splash_screen.png
  android_12:
    color: "#E6500A"
    icon_background_color: "#E6500A"
    image: assets/splash/android12_transparent.png
  ios: true
  web: true
  fullscreen: true

flutter_launcher_icons:
  android: false
  ios: false
  web:
    generate: true
  image_path: assets/splash/app_icon.png
  # Android/iOS launcher packs come from english-icons/; regenerate web only.

flutter:
  uses-material-design: true

  assets:
    - assets/data/quran.colored.json
    - assets/data/quran.metadata.json
    - assets/data/english_db.sqlite
    - assets/fonts/KFGQPCNastaleeq-Regular.ttf
    - assets/fonts/AlQuranIndoPak.ttf
    - assets/splash/splash_screen.png
    - assets/reciters/
    - assets/flags/
    - assets/azan-audio/

  fonts:
    - family: KFGQPCNastaleeq
      fonts:
        - asset: assets/fonts/KFGQPCNastaleeq-Regular.ttf
    - family: AlQuranIndoPak
      fonts:
        - asset: assets/fonts/AlQuranIndoPak.ttf
